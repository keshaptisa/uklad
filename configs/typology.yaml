# Имена типов (номера - канонический порядок по медианным тратам на жителя, см. scripts/s11_types.py).
# Даны после чтения профилей (outputs/interpret/profile_median.csv, mirkin_dev.csv, fca.csv). K = 6, KEFRiN-c.
names:
  0: Столичные агломерации и центры услуг
  1: Ресурсные территории Севера и Востока
  2: Промышленные и крупные города
  3: Транспортные узлы
  4: Районы бюджетной экономики
  5: Аграрные районы

# Одна фраза о каждом типе - для отчёта и лендинга (медианы типа). ПРОВЕРЯТЬ после каждого пересчёта.
short:
  0: Москва, Петербург, ближнее Подмосковье и крупнейшие центры услуг (Екатеринбург, Тюмень, Владивосток, Хабаровск) - половина занятых в рыночных услугах, самые высокие траты и зарплаты, общепит 7,5% трат.
  1: Нефтегазовые, угольные и северные районы и города (Сургут, Норильск, Якутск, Петропавловск-Камчатский) - добыча 20% занятых, зарплата 113 тыс. ₽, худшая доступность рынков, маркетплейсов меньше всех.
  2: Новосибирск, Казань, Нижний Новгород и сотни промышленных городов - обрабатывающая промышленность 38% занятых.
  3: Железнодорожные и портовые узлы (Тайгинский, Боготол, Ртищевский, Коношский, Находка, Тайшет) - каждый пятый работник занят в транспорте.
  4: Районы, где 63% рабочих мест - бюджетные; самые низкие зарплаты, на продовольствие уходит почти половина корзины.
  5: Сельские районы, где каждый пятый работник занят в сельском хозяйстве; траты на 15% ниже медианы страны.

# Имена типов ритма (outputs/rhythm/types.csv; номера - порядок k-means при seed из pipeline.yaml).
rhythm_names:
  0: Летний пик
  1: Зимний пик
  2: Арктический июль
  3: Северо-восточный август
rhythm_short:
  0: "Траты на 4% выше обычного в июле, общепит - на 7%. Неоднородный: сельские районы Алтая, Карелии, Костромы (туризм, дачи) и треть - северные ресурсные МО."
  1: Летом тратят меньше обычного, зимой - больше (Калининградская область, Урал). Ритм слабый, мы его не интерпретируем.
  2: В июле траты на 17% выше обычного, общепит - на 43%, а продукты почти не растут - это приток людей в навигацию и сезон вахт, а не завоз (Анадырь, Таймыр, Ямал).
  3: "Пик в августе: улусы Якутии и районы Забайкалья. Растут общепит (+23%) и здоровье, продукты - нет: летний приток людей; версия сезонной добычи не подтвердилась."
