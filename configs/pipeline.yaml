# Все гиперпараметры пайплайна. Пути — от корня репозитория.
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  outputs: outputs

data:
  # Панель: только МО с полной историей 24 месяца по всем 6 категориям.
  months: ["2023-01", "2024-12"]
  categories:            # короткие имена категорий СберИндекса
    Все категории: total
    Продовольствие: food
    Здоровье: health
    Маркетплейсы: market
    Общественное питание: cafe
    Транспорт: transport
  rosstat_year: 2024      # год контекста Росстата; если значения нет — берём 2023
  rosstat_period: Январь-декабрь

# Агрегирование разделов ОКВЭД2 в укрупнённые отрасли (доли в среднесписочной численности).
okved_groups:
  agro: [А]                       # сельское, лесное хозяйство, рыболовство
  mining: [В]                     # добыча полезных ископаемых
  industry: [C, D, Е, F]          # обрабатывающие, энергетика, ЖКХ, строительство
  transport: [Н]                  # транспортировка и хранение (железнодорожные узлы, порты, трубопроводы)
  market_services: [G, I, J, K, L, M, N, S, R]   # торговля и прочие рыночные услуги
  public: [O, P, Q]               # госуправление, образование, здравоохранение

# Правила ребра и разрежение
edges:
  k: 15            # число соседей в kNN-графе (объединение, симметризация)
  max_lag: 2       # максимальный сдвиг в лаговой корреляции, мес.
  dtw_window: 2    # окно Сакоэ–Тибы для DTW, мес.
  road_d0: 200     # масштаб дорожной близости exp(−d/d0), км

# Основная атрибутированная сеть: атрибуты = экономическая база + уровень трат, рёбра = сходство потребления.
typology:
  attributes: [log_wage, log_pop, urban_share, log_market_access,
               emp_agro, emp_mining, emp_industry, emp_transport, emp_market_services, emp_public, level]
  graph: dtw          # правило ребра из edges (static_<graph>.npz)
  metric: cosine      # расстояние в KEFRiN: cosine (KEFRiN-c) — 1-е место в рейтинге Алескерова (outputs/method_comparison/ranking.csv)
  K: 6                # число типов: наибольшее K, при котором все типы устойчивы (Хенниг > 0,75) — outputs/choose_k
  K_range: [3, 10]
  bootstrap: 20       # подвыборок по 80% МО для устойчивости
  n_perm: 50          # перестановок меток для z-оценок ICVI

# Динамика: помесячные сети и отслеживание типов
dynamics:
  smooth: 3              # скользящее среднее корзины для помесячного графа, мес.
  alphas: [0.25, 0.5, 0.75]
  alpha: 0.5             # вес истории в основной (эволюционной) версии — выбор в outputs/dynamics/variants.csv
  omegas: [0.5, 1.0]     # межслойный вес temporal Leiden
  min_run: 3             # переход засчитывается, если новый тип держится ≥ min_run мес.

# Линза ритма (сезонность трат без общероссийского месяца и собственного тренда МО)
rhythm:
  categories: [total, cafe, food, transport]
  K_range: [3, 7]

interpret:
  oipc_eps: 0.0        # допуск равенства в OIPC (ранг-процентили)
  oipc_min_size: 20    # «крупный» паттерн — не меньше стольких МО

# Лендинг
site:
  tol: 0.03            # допуск упрощения границ, градусы
  tol_small: 0.003     # для маленьких МО (города, районы Москвы и Петербурга)
  small_area: 0.05     # «маленький» полигон, кв. градусы
  decimals: 3

# Синтетическая проверка способов отслеживания типов
synthetic:
  n_nodes: 800      # МО в синтетике (подвыборка панели)
  migrate: 0.05     # доля МО, по-настоящему меняющих тип в месяце 12
  reps: 3
